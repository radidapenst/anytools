server {
    listen 80;
    server_name your-domain.com; # Ganti dengan domain/subdomain Cloudflare Anda

    root /var/www/anytools/dist; # Lokasi folder build (dist) di Ubuntu Server Anda
    index index.html;

    # ========================================================
    # HEADER KRUSIAL UNTUK WEBASSEMBLY (FFMPEG & PDF.JS)
    # ========================================================
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Header Keamanan Tambahan untuk Produksi
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA (Single Page Application) Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optimasi Cache & MIME Type untuk Modul WASM (32MB)
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Static Assets (JS, CSS, Gambar)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # Maksimal upload file ke buffer (karena proses lokal, client tidak upload ke server)
    client_max_body_size 50M;
}
